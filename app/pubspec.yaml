name: my_heart
description: "Tu espacio romántico privado con tu pareja."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.1
  socket_io_client: ^3.0.1
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  home_widget: ^0.7.0
  uuid: ^4.4.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

# ── App Icon Configuration ─────────────────────────────────────────────────
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FF4D79"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  min_sdk_android: 21

# ── Flutter ────────────────────────────────────────────────────────────────
flutter:
  uses-material-design: true

  assets:
    - assets/icon/

